[project]
name = "tradingbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ccxt",
    "pydantic>=2",
    "pydantic-settings",
    "PyYAML",
    "pandas",
    "SQLAlchemy",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]